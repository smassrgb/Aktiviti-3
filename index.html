<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOLAT QUEST – THE 13 RUKUN CHALLENGE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Press+Start+2P&family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* =====================================================================
       SOLAT QUEST – EMPTY TRANSPARENT BACKGROUND + DARK GLASSMORPHISM BOX
       ===================================================================== */
    :root {
      --accent-primary: #FF4FA3;
      --accent-neon: #FF2D75;
      --accent-purple: #9B5CFF;
      --accent-cyan: #50DCFF;
      --text-white: #FFFFFF;
      --text-soft: #E9D5FF;

      /* Dark Glass Box Tokens: 20px blur, rich theme dark tint, subtle border & soft glow */
      --master-glass-bg: linear-gradient(155deg, rgba(20, 10, 42, 0.94), rgba(42, 22, 75, 0.92));
      --master-glass-border: rgba(184, 154, 255, 0.28);
      --master-glass-glow: rgba(184, 154, 255, 0.16);
      --master-glass-shadow: 0 22px 48px rgba(8, 4, 20, 0.45), inset 0 1px 0 rgba(233, 213, 255, 0.16);
      --master-glass-blur: 20px;
      --master-radius: 26px;

      /* Category Colors (Consistent Across All Views) */
      --cat-qalbi: #9B5CFF;
      --cat-qalbi-glow: rgba(155, 92, 255, 0.36);
      --cat-qauli: #FF4FA3;
      --cat-qauli-glow: rgba(255, 79, 163, 0.36);
      --cat-fili: #4EDFFF;
      --cat-fili-glow: rgba(78, 223, 255, 0.36);

      /* Theme Dynamic Accent Variables */
      --theme-primary: #C084FC;
      --theme-secondary: #2A164B;
      --theme-accent-alt: #50DCFF;
      --theme-glow: rgba(184, 154, 255, 0.24);
      --display-font: 'Space Grotesk', 'Inter', sans-serif;
      --body-font: 'Inter', sans-serif;
    }

    /* THEME 1 – FUTURISTIC (DARK PURPLE GLASS + LAVENDER BORDER + SOFT LAVENDER GLOW) */
    body[data-theme="futuristic"],
    body[data-theme="neon-pink"] {
      --text-white: #F8FAFC;
      --text-soft: #E9D5FF;
      --theme-primary: #C084FC;
      --theme-secondary: #2A164B;
      --theme-accent-alt: #67E8F9;
      --theme-glow: rgba(184, 154, 255, 0.24);
      --master-glass-bg: linear-gradient(155deg, rgba(20, 10, 42, 0.94), rgba(42, 22, 75, 0.92));
      --master-glass-border: rgba(184, 154, 255, 0.28);
      --master-glass-glow: rgba(184, 154, 255, 0.16);
      --master-glass-shadow: 0 22px 48px rgba(8, 4, 20, 0.45), inset 0 1px 0 rgba(233, 213, 255, 0.16);
      --master-glass-blur: 20px;
      --master-radius: 26px;
      --display-font: 'Space Grotesk', 'Inter', sans-serif;
      --body-font: 'Inter', sans-serif;
    }

    /* THEME 2 – RETRO (DARK NAVY BLUE GLASS + BRIGHT CYAN/BLUE CONTRAST) */
    body[data-theme="retro"] {
      --text-white: #F0F9FF;
      --text-soft: #7DD3FC;
      --theme-primary: #38BDF8;
      --theme-secondary: #0F2952;
      --theme-accent-alt: #67E8F9;
      --theme-glow: rgba(56, 189, 248, 0.24);
      --master-glass-bg: linear-gradient(155deg, rgba(7, 20, 46, 0.94), rgba(15, 41, 82, 0.92));
      --master-glass-border: rgba(125, 211, 252, 0.32);
      --master-glass-glow: rgba(56, 189, 248, 0.18);
      --master-glass-shadow: 0 22px 48px rgba(4, 12, 30, 0.48), inset 0 1px 0 rgba(186, 230, 253, 0.18);
      --master-glass-blur: 20px;
      --master-radius: 16px;
      --display-font: 'Press Start 2P', 'Space Grotesk', monospace;
      --body-font: 'Space Grotesk', 'Inter', sans-serif;
    }

    /* THEME 3 – GUNDAM (DARK GUNMETAL / METALLIC GREY GLASS + WHITE, RED & BLUE ACCENTS) */
    body[data-theme="gundam"],
    body[data-theme="cyber-blue"],
    body[data-theme="purple-galaxy"] {
      --text-white: #FFFFFF;
      --text-soft: #E2E8F0;
      --theme-primary: #EF4444;
      --theme-secondary: #1E293B;
      --theme-accent-alt: #60A5FA;
      --theme-glow: rgba(148, 163, 184, 0.24);
      --master-glass-bg: linear-gradient(155deg, rgba(24, 28, 36, 0.94), rgba(43, 49, 62, 0.92));
      --master-glass-border: rgba(203, 213, 225, 0.3);
      --master-glass-glow: rgba(226, 232, 240, 0.15);
      --master-glass-shadow: 0 22px 46px rgba(9, 11, 16, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.18);
      --master-glass-blur: 20px;
      --master-radius: 16px;
      --display-font: 'Rajdhani', 'Space Grotesk', sans-serif;
      --body-font: 'Rajdhani', 'Inter', sans-serif;
    }

    body.no-animations *,
    body.no-animations *::before,
    body.no-animations *::after {
      animation: none !important;
      transition-duration: 0.01ms !important;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    /* Strictly empty, transparent background on root, html, body & wrappers */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      background: transparent !important;
      background-color: transparent !important;
      background-image: none !important;
      color: var(--text-white);
      font-family: var(--body-font);
      overflow-x: hidden;
      user-select: none;
    }

    h1, h2, h3, .font-display {
      font-family: var(--display-font);
    }

    /* Hero Hologram Rings & Crystalline Accents */
    .holo-ring-outer {
      animation: ringSpinSlow 20s linear infinite;
    }

    .holo-ring-inner {
      animation: ringSpinReverse 14s linear infinite;
    }

    @keyframes ringSpinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes ringSpinReverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    /* AAA Main Menu Staggered Entrance */
    .menu-stagger-1 { animation: menuItemIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both; animation-delay: 0.05s; }
    .menu-stagger-2 { animation: menuItemIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both; animation-delay: 0.12s; }
    .menu-stagger-3 { animation: menuItemIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both; animation-delay: 0.19s; }
    .menu-stagger-4 { animation: menuItemIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both; animation-delay: 0.26s; }
    .menu-stagger-5 { animation: menuItemIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both; animation-delay: 0.33s; }
    .menu-stagger-6 { animation: menuItemIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both; animation-delay: 0.40s; }

    @keyframes menuItemIn {
      from { opacity: 0; transform: translateX(14px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .nav-rail-item {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.72rem 1rem;
      border: 1px solid var(--master-glass-border);
      border-radius: 12px;
      color: var(--text-white);
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      cursor: pointer;
      transition: transform 0.2s ease, color 0.2s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    body[data-theme="gundam"] .nav-rail-item {
      background: rgba(255, 255, 255, 0.08);
    }

    .nav-rail-item::before {
      content: "";
      position: absolute;
      left: 0;
      top: 18%;
      bottom: 18%;
      width: 3px;
      background: var(--theme-primary);
      box-shadow: 0 0 12px var(--theme-primary);
      opacity: 0;
      transform: scaleY(0.3);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .nav-rail-item:hover {
      color: var(--text-white);
      transform: translateY(-2px);
      border-color: var(--theme-primary);
      background: rgba(255, 255, 255, 0.14);
      box-shadow: 0 6px 18px var(--theme-glow);
    }

    .nav-rail-item:hover::before {
      opacity: 1;
      transform: scaleY(1);
    }

    .nav-rail-item.nav-start-highlight {
      color: #FFFFFF;
      border: 1.5px solid var(--theme-primary);
      border-radius: 14px;
      background: linear-gradient(120deg, rgba(139, 92, 246, 0.62), rgba(255, 79, 163, 0.52));
      box-shadow: 0 0 24px var(--theme-glow);
      padding: 0.92rem 1.2rem;
    }

    body[data-theme="retro"] .nav-rail-item.nav-start-highlight {
      background: linear-gradient(120deg, rgba(2, 132, 199, 0.72), rgba(56, 189, 248, 0.48));
    }

    body[data-theme="gundam"] .nav-rail-item.nav-start-highlight {
      background: linear-gradient(120deg, rgba(37, 99, 235, 0.78), rgba(220, 38, 38, 0.78));
    }

    .nav-rail-item.nav-start-highlight:hover {
      transform: translateY(-2px) scale(1.015);
      box-shadow: 0 0 32px var(--theme-glow);
    }

    /* =====================================================================
       START MISSION ROCKET LAUNCH OVERLAY (4-PHASE CINEMATIC SEQUENCE)
       ===================================================================== */
    .rocket-launch-overlay {
      position: fixed;
      inset: 0;
      z-index: 135;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      overflow: hidden;
      opacity: 0;
      background: transparent;
      transition: opacity 0.45s ease;
    }

    .rocket-launch-overlay.phase-1 {
      opacity: 1;
      background: transparent;
    }

    .rocket-launch-overlay.phase-2 {
      opacity: 1;
      background: transparent;
    }

    .rocket-launch-overlay.phase-3 {
      opacity: 1;
      background: transparent;
    }

    .rocket-launch-overlay.phase-4 {
      opacity: 0;
      background: transparent;
      transition: opacity 0.48s ease;
    }

    .rocket-stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(24px) scale(0.92);
      transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .rocket-launch-overlay.phase-2 .rocket-stage,
    .rocket-launch-overlay.phase-3 .rocket-stage {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .rocket-launch-overlay.phase-3 .rocket-stage {
      transform: translateY(-135vh) scale(1.16);
      transition: transform 0.92s cubic-bezier(0.55, 0.05, 0.85, 0.35),
                  opacity 0.92s ease-in;
    }

    .rocket-ignition-shake {
      animation: rocketRumble 0.11s linear infinite;
    }

    @keyframes rocketRumble {
      0%, 100% { transform: translate(-2px, 1px) rotate(-0.6deg); }
      50% { transform: translate(2px, -1px) rotate(0.6deg); }
    }

    .rocket-plume {
      width: 22px;
      height: 0px;
      border-radius: 999px;
      margin-top: -4px;
      opacity: 0;
      filter: blur(2px);
      transition: height 0.35s ease, opacity 0.35s ease, width 0.35s ease;
    }

    .rocket-launch-overlay.phase-2 .rocket-plume {
      height: 54px;
      opacity: 0.85;
    }

    .rocket-launch-overlay.phase-3 .rocket-plume {
      width: 34px;
      height: 145px;
      opacity: 1;
      filter: blur(3px);
    }

    .rocket-exhaust-trail {
      position: absolute;
      top: 100%;
      width: 14px;
      height: 220px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .rocket-launch-overlay.phase-3 .rocket-exhaust-trail {
      opacity: 0.72;
    }

    .menu-fade-out-active > * {
      opacity: 0 !important;
      transform: translateY(-10px) scale(0.98) !important;
      transition: opacity 0.42s ease, transform 0.42s ease !important;
      pointer-events: none !important;
    }

    @media (prefers-reduced-motion: reduce) {
      .rocket-ignition-shake { animation: none !important; }
      .rocket-launch-overlay,
      .rocket-stage,
      .menu-fade-out-active > * {
        transition-duration: 0.15s !important;
      }
    }

    /* Viewport Frame & Resolution Scaling (Transparent Outside Glass Box) */
    .app-shell {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      width: 100%;
      background: transparent !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(0.65rem, 2.5vw, 1.5rem);
    }

    .resolution-frame {
      width: 100%;
      max-width: 1120px;
      background: transparent !important;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: max-width 0.3s ease;
    }

    body[data-res="1280x720"] .resolution-frame { max-width: 1120px; }
    body[data-res="1600x900"] .resolution-frame { max-width: 1260px; }
    body[data-res="1920x1080"] .resolution-frame { max-width: 1380px; }

    /* =====================================================================
       SINGLE MASTER COLOURED GLASS CONTAINER (20px BLUR + THEME TINT)
       ===================================================================== */
    .master-glass-container {
      position: relative;
      width: 100%;
      background: var(--master-glass-bg);
      backdrop-filter: blur(var(--master-glass-blur));
      -webkit-backdrop-filter: blur(var(--master-glass-blur));
      border: 1px solid var(--master-glass-border);
      border-radius: var(--master-radius);
      box-shadow: var(--master-glass-shadow), 0 0 36px var(--master-glass-glow);
      padding: clamp(1.15rem, 3vw, 2.35rem);
      overflow: hidden;
    }

    /* Subtle Glass Reflection Sheen Inside Glass Box */
    .master-glass-container::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(125deg, rgba(255, 255, 255, 0.1) 0%, transparent 45%, rgba(255, 255, 255, 0.02) 100%);
      pointer-events: none;
      z-index: 0;
    }

    .master-glass-container > * {
      position: relative;
      z-index: 1;
    }

    /* Selective Mechanical Bolts for GUNDAM Theme Only */
    .gundam-bolts {
      display: none;
    }

    body[data-theme="gundam"] .gundam-bolts {
      display: block;
    }

    .mech-bolt {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(145deg, #F8FAFC, #64748B);
      border: 1px solid #0F172A;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.75);
      pointer-events: none;
      z-index: 5;
    }

    .mech-bolt::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 15%;
      right: 15%;
      height: 1.5px;
      background: #0F172A;
      transform: translateY(-50%) rotate(28deg);
    }

    .mech-bolt.tl { top: 10px; left: 10px; }
    .mech-bolt.tr { top: 10px; right: 10px; }
    .mech-bolt.bl { bottom: 10px; left: 10px; }
    .mech-bolt.br { bottom: 10px; right: 10px; }

    /* Minimal Inline Divider */
    .section-divider {
      height: 1px;
      width: 100%;
      background: linear-gradient(90deg, transparent, var(--master-glass-border), transparent);
      margin: 0.75rem 0;
    }

    .glass-input {
      background: rgba(15, 8, 32, 0.62);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid var(--master-glass-border);
      color: var(--text-white);
      box-shadow: 0 0 18px var(--theme-glow);
      transition: all 0.22s ease;
    }

    body[data-theme="retro"] .glass-input {
      background: rgba(6, 18, 42, 0.66);
    }

    body[data-theme="gundam"] .glass-input {
      background: rgba(17, 21, 28, 0.66);
      color: #FFFFFF;
    }

    .glass-input:focus {
      outline: none;
      border-color: var(--theme-primary);
      box-shadow: 0 0 24px var(--theme-glow);
    }

    /* =====================================================================
       MINIMAL GLASS BUTTON SYSTEM
       ===================================================================== */
    .futuristic-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 0.68rem 1.45rem;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--master-glass-border);
      color: var(--text-white);
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.2s ease,
                  box-shadow 0.2s ease,
                  background 0.2s ease;
    }

    body[data-theme="gundam"] .futuristic-btn {
      background: rgba(255, 255, 255, 0.1);
    }

    body[data-theme="retro"] .futuristic-btn {
      border-radius: 8px;
      font-size: 0.68rem;
      letter-spacing: 0.04em;
    }

    body[data-theme="gundam"] .futuristic-btn {
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .futuristic-btn::after {
      content: "";
      position: absolute;
      bottom: 4px;
      left: 50%;
      width: 0%;
      height: 2px;
      background: linear-gradient(90deg, var(--theme-primary), var(--theme-accent-alt));
      transform: translateX(-50%);
      transition: width 0.25s ease;
      border-radius: 999px;
    }

    .futuristic-btn:hover {
      transform: translateY(-2px) scale(1.025);
      border-color: var(--theme-primary);
      background: rgba(255, 255, 255, 0.14);
      box-shadow: 0 0 18px var(--theme-glow);
    }

    .futuristic-btn:hover::after {
      width: 56%;
    }

    .futuristic-btn:active {
      transform: scale(0.97);
    }

    .futuristic-btn.btn-primary-hero {
      padding: 0.9rem 2.2rem;
      font-size: 0.98rem;
      letter-spacing: 0.1em;
      border-color: var(--theme-primary);
      background: rgba(168, 85, 247, 0.34);
      box-shadow: 0 0 24px var(--theme-glow);
    }

    body[data-theme="retro"] .futuristic-btn.btn-primary-hero {
      font-size: 0.78rem;
      background: rgba(56, 189, 248, 0.32);
    }

    body[data-theme="gundam"] .futuristic-btn.btn-primary-hero {
      color: #FFFFFF;
      background: rgba(220, 38, 38, 0.85);
    }

    .ripple-circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.32);
      transform: scale(0);
      animation: rippleAnim 0.52s linear;
      pointer-events: none;
    }

    @keyframes rippleAnim {
      to {
        transform: scale(3.5);
        opacity: 0;
      }
    }

    /* =====================================================================
       CATEGORY BADGES & RUKUN CARDS (ALWAYS VISIBLE CATEGORY LABEL)
       ===================================================================== */
    .cat-qalbi {
      --cat-color: #9B5CFF;
      --cat-glow: rgba(155, 92, 255, 0.36);
      --cat-bg: rgba(155, 92, 255, 0.18);
    }
    .cat-qauli {
      --cat-color: #FF4FA3;
      --cat-glow: rgba(255, 79, 163, 0.36);
      --cat-bg: rgba(255, 79, 163, 0.18);
    }
    .cat-fili {
      --cat-color: #4EDFFF;
      --cat-glow: rgba(78, 223, 255, 0.36);
      --cat-bg: rgba(78, 223, 255, 0.18);
    }

    .rukun-card {
      position: relative;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--master-glass-border);
      border-left: 3px solid var(--cat-color);
      border-radius: 14px;
      padding: 0.78rem 0.9rem;
      cursor: grab;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.2s ease,
                  border-color 0.2s ease;
      box-shadow: 0 4px 16px rgba(8, 4, 20, 0.22);
      touch-action: none;
    }

    body[data-theme="gundam"] .rukun-card {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 6px;
    }

    body[data-theme="retro"] .rukun-card {
      background: rgba(255, 255, 255, 0.07);
      border-radius: 8px;
    }

    .rukun-card:hover {
      transform: translateY(-3px);
      border-color: var(--theme-primary);
      border-left-color: var(--cat-color);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.14), 0 0 16px var(--cat-glow);
    }

    .rukun-card.selected-tap {
      transform: translateY(-3px) scale(1.02);
      border-color: var(--cat-color);
      box-shadow: 0 0 22px var(--cat-glow);
    }

    .rukun-card.hint-highlight {
      animation: hintPulse 1.1s ease-in-out infinite;
      border-color: var(--cat-color);
    }

    @keyframes hintPulse {
      0%, 100% { box-shadow: 0 0 10px var(--cat-glow); }
      50% { box-shadow: 0 0 24px var(--cat-color); }
    }

    .category-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.14rem 0.5rem;
      border-radius: 9999px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--cat-color);
      background: var(--cat-bg);
      border: 1px solid var(--cat-color);
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* Answer Slot Styling */
    .answer-slot {
      position: relative;
      min-height: 88px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px dashed var(--master-glass-border);
      padding: 0.7rem 0.85rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.2s ease;
    }

    body[data-theme="gundam"] .answer-slot {
      background: rgba(255, 255, 255, 0.05);

    /* =====================================================================

    .fullscreen-fx-overlay {

    .fx-correct-bg {
      position: absolute;

    }

    @keyframes correctFlashPulse {
      0% { opacity: 0; transform: scale(1.04); }
      20% { opacity: 1; transform: scale(1); }
      80% { opacity: 0.9; }
      100% { opacity: 0; }
    }

    @keyframes ringExpandFade {
      0% { transform: scale(0.4); opacity: 1; }
      100% { transform: scale(5.5); opacity: 0; }
    }

    .fx-wrong-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(255, 54, 92, 0.28) 0%, rgba(185, 28, 28, 0.14) 55%, transparent 85%);

    .fx-scan-red {

    }

    @keyframes wrongWaveGlitch {
      0% { opacity: 0; transform: translateX(-6px); }
      15% { opacity: 1; transform: translateX(6px); }

    .fx-streak-bg {
      position: absolute;

    .fx-digital-flames {
      position: absolute;

    @keyframes streakBgAnim {

    .fx-center-pop {

    @keyframes centerHeroPop {

    .screen-shake {

    @keyframes subtleScreenShake {

<body data-theme="futuristic" data-res="auto">
  <!-- Fullscreen Animation Overlay System (Correct, Wrong, Streak) -->
  <div id="fullscreen-fx-overlay" class="fullscreen-fx-overlay" aria-live="assertive"></div>

  <!-- Main Application Shell (100% Transparent Outside Master Glass Box) -->
  <main id="app-shell" class="app-shell">
    <div id="resolution-frame" class="resolution-frame">
      <!-- Single Master Theme-Tinted Transparent Glass Container -->
      <div id="master-glass" class="master-glass-container">
        <!-- Selective Mechanical Screws (Shown in Gundam Theme) -->
        <div class="gundam-bolts" aria-hidden="true">
          <span class="mech-bolt tl"></span>
          <span class="mech-bolt tr"></span>
          <span class="mech-bolt bl"></span>
          <span class="mech-bolt br"></span>
        </div>

        <div id="view-container" class="w-full"></div>
      </div>
    </div>
  </main>

  <!-- Quit Confirmation Modal -->
  <div id="quit-modal" class="fixed inset-0 z-[140] hidden items-center justify-center backdrop-blur-md p-4">
    <div class="master-glass-container max-w-md w-full p-7 text-center">
      <div class="w-12 h-12 mx-auto mb-4 rounded-full flex items-center justify-center bg-pink-500/15 border border-pink-400/40 text-pink-300">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H6a2 2 0 01-2-2V7a2 2 0 012-2h5a2 2 0 012 2v1" />
        </svg>
      </div>
      <h3 class="font-display text-lg sm:text-xl font-bold tracking-wider uppercase mb-2">ARE YOU SURE YOU WANT TO EXIT?</h3>
      <p class="text-sm opacity-85 mb-6">Kemajuan &amp; XP anda akan disimpan sebelum kembali ke halaman utama.</p>
      <div class="flex flex-wrap items-center justify-center gap-3">
        <button id="btn-back-to-game" class="futuristic-btn" type="button">BACK TO GAME</button>
        <button id="btn-confirm-exit" class="futuristic-btn btn-primary-hero" type="button">EXIT</button>
      </div>
    </div>
  </div>

  <script>
    /* =====================================================================
       2. AUDIO MANAGER (SFX DEFAULT 65%, SINGLE BACKGROUND MUSIC MP3 AT 2%)
       ===================================================================== */
    const INTERSTELLAR_RAW_MP3_URL =
      'https://raw.githubusercontent.com/smassrgb/Aktiviti-1/main/Interstellar%20Main%20Theme%20-%20Hans%20Zimmer.mp3';

    class BackgroundMusicManager {
      constructor(url) {
        this.url = url;
        this.audio = null;
        this.initialized = false;
        this.userInteracted = false;
        this.isMuted = false;
        this.volumePercent = 2; // Default 2%
        this.fadeTimer = null;
        this.stopping = false;
      }

      initOnce() {
        if (this.initialized) return;
        this.initialized = true;

        try {
          const el = new Audio();
          el.preload = 'auto';
          el.loop = true;
          el.volume = 0;

          el.addEventListener('timeupdate', () => {
            if (
              !this.stopping &&
              el.duration &&
              Number.isFinite(el.duration) &&
              el.duration > 2 &&
              el.duration - el.currentTime <= 0.12
            ) {
              try {
                el.currentTime = 0;
              } catch (e) {
                // Ignore seek error
              }
            }
          });

          el.addEventListener('error', () => {
            // Silent error handling so gameplay is never disrupted
          });

          el.src = this.url;
          this.audio = el;
        } catch (e) {
          this.audio = null;
        }
      }

      clearFade() {
        if (this.fadeTimer !== null) {
          clearInterval(this.fadeTimer);
          this.fadeTimer = null;
        }
      }

      getTargetVolume() {
        if (this.isMuted) return 0;
        const normalized = Math.max(0, Math.min(100, Number(this.volumePercent) || 0)) / 100;
        return Math.max(0, Math.min(1, normalized * 0.5));
      }

      startOnFirstInteraction(fadeSeconds = 6.5) {
        this.userInteracted = true;
        this.initOnce();
        if (!this.audio) return;

        if (this.isMuted) {
          this.audio.pause();
          return;
        }

        const alreadyPlaying = !this.audio.paused && !this.stopping;
        if (alreadyPlaying) {
          this.applyVolumeImmediate();
          return;
        }

        this.stopping = false;
        this.clearFade();

        const targetVol = this.getTargetVolume();
        if (targetVol <= 0) {
          this.audio.volume = 0;
          return;
        }

        const startVol = 0.0001;
        this.audio.volume = startVol;

        const playPromise = this.audio.play();
        if (playPromise && typeof playPromise.catch === 'function') {
          playPromise.catch(() => {
            // Browser blocked autoplay or stream unavailable; fail silently
          });
        }

        const totalMs = Math.max(5000, Math.min(8000, fadeSeconds * 1000));
        const stepMs = 100;
        const steps = Math.max(1, Math.floor(totalMs / stepMs));
        let currentStep = 0;

        this.fadeTimer = setInterval(() => {
          if (!this.audio || this.stopping || this.isMuted) {
            this.clearFade();
            return;
          }
          currentStep += 1;
          const progress = Math.min(1, currentStep / steps);
          const nextVol = startVol + (this.getTargetVolume() - startVol) * progress;
          this.audio.volume = Math.max(0, Math.min(1, nextVol));

          if (progress >= 1) {
            this.clearFade();
          }
        }, stepMs);
      }

      applyVolumeImmediate() {
        if (!this.audio) return;
        if (this.isMuted || this.stopping) {
          this.audio.volume = 0;
          return;
        }
        this.audio.volume = this.getTargetVolume();
      }

      setVolumePercent(percent) {
        this.volumePercent = Math.max(0, Math.min(100, Number(percent) || 0));
        this.initOnce();
        if (!this.userInteracted) {
          if (this.audio) this.audio.volume = 0;
          return;
        }
        if (this.isMuted) return;

        this.clearFade();
        if (this.volumePercent <= 0) {
          this.applyVolumeImmediate();
          return;
        }

        if (this.audio && this.audio.paused && !this.stopping) {
          this.startOnFirstInteraction(6.0);
        } else {
          this.applyVolumeImmediate();
        }
      }

      setMuted(muted) {
        this.isMuted = !!muted;
        this.initOnce();
        if (!this.audio) return;

        if (this.isMuted) {
          this.clearFade();
          this.audio.volume = 0;
          try {
            this.audio.pause();
          } catch (e) {
            // Ignore pause error
          }
        } else {
          this.applyVolumeImmediate();
          if (this.userInteracted && !this.stopping) {
            this.startOnFirstInteraction(6.0);
          }
        }
      }

      stopWithFadeOut(fadeSeconds = 1.6, resetPosition = false) {
        this.initOnce();
        if (!this.audio) return;

        this.stopping = true;
        this.clearFade();

        const initialVol = Math.max(0, this.audio.volume || 0);
        if (this.audio.paused || initialVol <= 0.0005) {
          this.audio.volume = 0;
          try {
            this.audio.pause();
            if (resetPosition) this.audio.currentTime = 0;
          } catch (e) {
            // Ignore error
          }
          this.stopping = false;
          return;
        }

        const totalMs = Math.max(400, fadeSeconds * 1000);
        const stepMs = 80;
        const steps = Math.max(1, Math.floor(totalMs / stepMs));
        let currentStep = 0;

        this.fadeTimer = setInterval(() => {
          if (!this.audio) {
            this.clearFade();
            return;
          }
          currentStep += 1;
          const remaining = Math.max(0, 1 - currentStep / steps);
          this.audio.volume = Math.max(0, initialVol * remaining);

          if (currentStep >= steps) {
            this.clearFade();
            this.audio.volume = 0;
            try {
              this.audio.pause();
              if (resetPosition) this.audio.currentTime = 0;
            } catch (e) {
              // Ignore error
            }
            this.stopping = false;
          }
        }, stepMs);
      }
    }

    const bgmManager = new BackgroundMusicManager(INTERSTELLAR_RAW_MP3_URL);

    class SoundEffectsManager {
      constructor() {
        this.ctx = null;
        this.sfxGain = null;
        this.isMuted = false;
        this.sfxVolume = 0.65; // Default 65%
      }

      ensureContext() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          this.ctx = new AudioCtx();
          this.sfxGain = this.ctx.createGain();
          this.sfxGain.connect(this.ctx.destination);
          this.applyVolume();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      }

      applyVolume() {
        if (!this.ctx || !this.sfxGain) return;
        const effectiveSfx = this.isMuted ? 0 : this.sfxVolume;
        this.sfxGain.gain.setTargetAtTime(effectiveSfx, this.ctx.currentTime, 0.03);
      }

      setSfxPercent(percent) {
        this.sfxVolume = Math.max(0, Math.min(1, percent / 100));
        this.applyVolume();
      }

      setMuted(muted) {
        this.isMuted = !!muted;
        this.applyVolume();
      }

      playTone(type, streakLevel = 0) {
        try {
          this.ensureContext();
          if (!this.ctx || this.isMuted || this.sfxVolume <= 0.001) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.connect(gain);
          gain.connect(this.sfxGain);

          switch (type) {
            case 'hover':
              osc.type = 'sine';
              osc.frequency.setValueAtTime(520, now);
              osc.frequency.exponentialRampToValueAtTime(640, now + 0.045);
              gain.gain.setValueAtTime(0.05, now);
              gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
              osc.start(now);
              osc.stop(now + 0.055);
              break;
            case 'click':
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(420, now);
              osc.frequency.exponentialRampToValueAtTime(740, now + 0.075);
              gain.gain.setValueAtTime(0.14, now);
              gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
              osc.start(now);
              osc.stop(now + 0.085);
              break;
            case 'correct':
              [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
                const cOsc = this.ctx.createOscillator();
                const cGain = this.ctx.createGain();
                cOsc.type = 'triangle';
                cOsc.frequency.setValueAtTime(freq, now + i * 0.065);
                cGain.gain.setValueAtTime(0.24, now + i * 0.065);
                cGain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.065 + 0.32);
                cOsc.connect(cGain);
                cGain.connect(this.sfxGain);
                cOsc.start(now + i * 0.065);
                cOsc.stop(now + i * 0.065 + 0.34);
              });
              break;
            case 'wrong':
              osc.type = 'sawtooth';
              osc.frequency.setValueAtTime(220, now);
              osc.frequency.exponentialRampToValueAtTime(115, now + 0.26);
              gain.gain.setValueAtTime(0.22, now);
              gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
              osc.start(now);
              osc.stop(now + 0.29);
              break;
            case 'streak': {
              const basePitch = 520 + Math.min(streakLevel, 10) * 45;
              const notes = streakLevel >= 10
                ? [587.33, 783.99, 987.77, 1174.66, 1567.98]
                : streakLevel >= 5
                  ? [523.25, 659.25, 783.99, 1046.5]
                  : [basePitch, basePitch * 1.25, basePitch * 1.5];
              notes.forEach((f, idx) => {
                const sOsc = this.ctx.createOscillator();
                const sGain = this.ctx.createGain();
                sOsc.type = streakLevel >= 5 ? 'triangle' : 'sine';
                sOsc.frequency.setValueAtTime(f, now + idx * 0.07);
                sGain.gain.setValueAtTime(0.24, now + idx * 0.07);
                sGain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.36);
                sOsc.connect(sGain);
                sGain.connect(this.sfxGain);
                sOsc.start(now + idx * 0.07);
                sOsc.stop(now + idx * 0.07 + 0.38);
              });
              break;
            }
            case 'transition':
              osc.type = 'sine';
              osc.frequency.setValueAtTime(392, now);
              osc.frequency.exponentialRampToValueAtTime(587.33, now + 0.22);
              gain.gain.setValueAtTime(0.15, now);
              gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
              osc.start(now);
              osc.stop(now + 0.26);
              break;
            case 'victory':
              [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((freq, idx) => {
                const vOsc = this.ctx.createOscillator();
                const vGain = this.ctx.createGain();
                vOsc.type = 'triangle';
                vOsc.frequency.setValueAtTime(freq, now + idx * 0.1);
                vGain.gain.setValueAtTime(0.24, now + idx * 0.1);
                vGain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.42);
                vOsc.connect(vGain);
                vGain.connect(this.sfxGain);
                vOsc.start(now + idx * 0.1);
                vOsc.stop(now + idx * 0.1 + 0.44);
              });
              break;
          }
        } catch (err) {
          // Safe audio fallback
        }
      }
    }

    const sfxManager = new SoundEffectsManager();

    const audio = {
      startAmbientMusic: () => bgmManager.startOnFirstInteraction(6.5),
      stopAmbientMusic: (reset = false) => bgmManager.stopWithFadeOut(1.6, reset),
      setSfxPercent: (pct) => sfxManager.setSfxPercent(pct),
      setMusicPercent: (pct) => bgmManager.setVolumePercent(pct),
      setMuted: (muted) => {
        sfxManager.setMuted(muted);
        bgmManager.setMuted(muted);
      },
      playTone: (type, streakLevel = 0) => sfxManager.playTone(type, streakLevel)
    };

    /* =====================================================================
       1. DATA LAYER: CATEGORIES, 13 RUKUN SOLAT & 3 LEVELS (4 + 4 + 5)
       ===================================================================== */
    const CATEGORY_META = {
      QALBI: {
        key: 'QALBI',
        label: 'QALBI',
        fullName: 'Rukun Qalbi (Hati / Minda)',
        color: '#9B5CFF',
        glow: 'rgba(155, 92, 255, 0.36)',
        cssClass: 'cat-qalbi',
        hintText: 'Rukun ini berkaitan dengan hati.',
        bodyRegion: 'HATI / MINDA – QALBI',
        bodyDesc: 'Berkaitan dengan niat di dalam hati serta tertib susunan rukun solat.',
        iconSvg: `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`
      },
      QAULI: {
        key: 'QAULI',
        label: 'QAULI',
        fullName: 'Rukun Qauli (Perkataan / Bacaan)',
        color: '#FF4FA3',
        glow: 'rgba(255, 79, 163, 0.36)',
        cssClass: 'cat-qauli',
        hintText: 'Rukun ini melibatkan bacaan.',

      playerName: '',

      levelReached: 1,
      totalScore: 0,
      highestStreak: 0,
      completedAll: false,
      settings: {
        resolution: 'auto',
        sfxVolume: 65,
        musicVolume: 2,
        muted: false,
        animations: true,
        particles: true
      },
      theme: 'futuristic',
      leaderboard: DEFAULT_LEADERBOARD
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
        const parsed = JSON.parse(raw);
        const merged = {
          ...JSON.parse(JSON.stringify(DEFAULT_STATE)),
          ...parsed,
          settings: {
            ...DEFAULT_STATE.settings,
            ...(parsed.settings || {})
          },
          leaderboard: Array.isArray(parsed.leaderboard) && parsed.leaderboard.length
            ? parsed.leaderboard
            : JSON.parse(JSON.stringify(DEFAULT_LEADERBOARD))
        };
        if (typeof merged.settings.musicVolume !== 'number' || Number.isNaN(merged.settings.musicVolume)) {
          merged.settings.musicVolume = 2;
        }
        return merged;
      } catch (e) {
        return JSON.parse(JSON.stringify(DEFAULT_STATE));
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {
        // Ignore storage error
      }
    }

    let appState = loadState();

    function getPlayerLevel(xp) {
      return Math.max(1, Math.floor(xp / 400) + 1);
    }

    function recordLeaderboardEntry(name, score, xp, statusText = null) {
      if (!name || !name.trim()) return;
      const cleanName = name.trim();
      const computedStatus = statusText || (appState.completedAll ? 'Completed' : `Level ${appState.levelReached || 1}`);
      const existingIdx = appState.leaderboard.findIndex(
        entry => entry.name.toLowerCase() === cleanName.toLowerCase()
      );
      if (existingIdx >= 0) {
        appState.leaderboard[existingIdx].score = Math.max(appState.leaderboard[existingIdx].score, score);
        appState.leaderboard[existingIdx].xp = Math.max(appState.leaderboard[existingIdx].xp, xp);
        appState.leaderboard[existingIdx].status = computedStatus;
      } else {
        appState.leaderboard.push({
          name: cleanName,
          score,
          xp,
          status: computedStatus
        });
      }
      appState.leaderboard.sort((a, b) => b.xp - a.xp || b.score - a.score);
      saveState();
    }

          ? 'gundam'
          : (appState.theme || 'futuristic');
      appState.theme = normalizedTheme;

      document.body.setAttribute('data-theme', normalizedTheme);
      document.body.setAttribute('data-res', appState.settings.resolution || 'auto');
      document.body.classList.toggle('no-animations', !appState.settings.animations);

      audio.setSfxPercent(appState.settings.sfxVolume);
      audio.setMusicPercent(appState.settings.musicVolume);
      audio.setMuted(appState.settings.muted);
      saveState();
    }

        document.body.appendChild(piece);

    function buildThemeRocketMarkup(theme) {

    function launchStartMission(onComplete) {
      if (isLaunchingMission) return;
      isLaunchingMission = true;

      const prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const useFastFallback = prefersReducedMotion || !appState.settings.animations;

      if (useFastFallback) {
        audio.playTone('transition');
        isLaunchingMission = false;
        onComplete();
        return;
      }

      const menuRoot = container.firstElementChild;
      if (menuRoot) {
        menuRoot.classList.add('menu-fade-out-active');
      }

      const overlay = document.createElement('div');
      overlay.className = 'rocket-launch-overlay';
      overlay.setAttribute('aria-hidden', 'true');
      overlay.innerHTML = `
        <div class="rocket-stage flex flex-col items-center justify-center">
          ${buildThemeRocketMarkup(appState.theme)}
          <p id="rocket-status-text" class="mt-4 px-3 py-1 rounded-full bg-black/25 backdrop-blur-md font-display text-xs sm:text-base font-extrabold tracking-[0.28em] uppercase text-white">
            PREPARING MISSION...
          </p>
        </div>
      `;
      document.body.appendChild(overlay);

      requestAnimationFrame(() => {
        overlay.classList.add('phase-1');
      });

      const statusEl = overlay.querySelector('#rocket-status-text');

      setTimeout(() => {
        overlay.classList.remove('phase-1');
        overlay.classList.add('phase-2');
        if (statusEl) statusEl.textContent = 'LOADING CHALLENGE...';
        audio.playTone('transition');
      }, 460);

      setTimeout(() => {
        overlay.classList.remove('phase-2');
        overlay.classList.add('phase-3');
        if (statusEl) statusEl.textContent = 'LAUNCHING...';
        audio.playTone('streak', 3);
      }, 1520);

      setTimeout(() => {
        overlay.classList.remove('phase-3');
        overlay.classList.add('phase-4');
        onComplete();
      }, 2420);

      setTimeout(() => {
        overlay.remove();
        isLaunchingMission = false;
      }, 2950);
    }

    /* ---------------------------------------------------------------------
       5. START – THE 13 RUKUN CHALLENGE (3 LEVELS: 4 + 4 + 5)
       --------------------------------------------------------------------- */
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function initNewGameSession() {
      gameSession = {
        currentLevelIndex: 0,
        score: 0,
        sessionXp: 0,
        streak: 0,
        highestStreak: 0,
        correctCount: 0,
        attemptCount: 0,
        hadMistakeInRun: false,
        levelCompletedModal: false,
        finalVictoryModal: false,
        levelStats: [],
        activeLevelState: createLevelRound(0)
      };
    }

    function createLevelRound(levelIdx) {
      const lvl = LEVELS_DATA[levelIdx];
      let bank = shuffleArray(lvl.items);
      if (bank.every((item, idx) => item.order === idx + 1) && bank.length > 1) {
        [bank[0], bank[1]] = [bank[1], bank[0]];
      }
      return {
        slots: Array(lvl.items.length).fill(null),
        bank,
        selectedCardId: null,
        hintsUsed: 0,
        activeHint: null
      };
    }

    function renderStartGame() {
      if (!gameSession) initNewGameSession();
      if (gameSession.finalVictoryModal) {
        renderFinalVictoryScreen();
        return;
      }
      if (gameSession.levelCompletedModal) {
        renderLevelTransitionScreen();
        return;
      }

      const lvl = LEVELS_DATA[gameSession.currentLevelIndex];
      const round = gameSession.activeLevelState;
      const totalPlaced = round.slots.filter(Boolean).length;
      const isFive = lvl.items.length === 5;
      const gridClass = isFive ? 'grid-cols-1 sm:grid-cols-3' : 'grid-cols-2';

      container.innerHTML = `
        <section class="w-full flex flex-col gap-3">
          <!-- Top Game Bar -->
          <div class="flex flex-wrap items-center justify-between gap-2 text-xs">
            <div class="flex items-center gap-2.5">
              <button id="btn-game-menu" type="button" class="futuristic-btn py-1 px-3 text-xs">← Menu</button>
              <span class="font-display font-bold tracking-wider text-[var(--theme-accent-alt)]">${lvl.code}</span>
              <span class="opacity-80">Progress: <strong>${totalPlaced}/${lvl.items.length}</strong></span>
            </div>

            <div class="flex items-center gap-3 font-semibold">

              <button id="btn-hint" type="button" class="futuristic-btn py-1 px-3 text-xs" ${round.hintsUsed >= lvl.hintLimit ? 'disabled style="opacity:0.45;cursor:not-allowed;"' : ''}>
                <span>💡 HINT (${lvl.hintLimit - round.hintsUsed})</span>
              </button>
            </div>
          </div>

          <!-- Level Title -->
          <div class="flex flex-wrap items-baseline justify-between gap-2">
            <div>
              <h2 class="font-display text-lg sm:text-xl font-bold">${lvl.title}</h2>
              <p class="text-xs text-[var(--text-soft)]">${lvl.subtitle}</p>
            </div>
            <span class="text-[11px] opacity-70">Tap kad &amp; slot atau drag-and-drop</span>
          </div>

          ${round.activeHint ? `
            <div class="py-2 px-3.5 rounded-xl bg-white/[0.08] border border-amber-300/45 flex items-center justify-between text-xs">
              <div class="flex items-center gap-2">
                <span class="category-pill ${CATEGORY_META[round.activeHint.category].cssClass}">
                  ${CATEGORY_META[round.activeHint.category].iconSvg}
                  <span>${CATEGORY_META[round.activeHint.category].label}</span>
                </span>
                <span class="font-medium">${round.activeHint.text}</span>
              </div>
              <button id="btn-close-hint" type="button" class="opacity-75 hover:opacity-100 font-bold">✕</button>
            </div>
          ` : ''}

          <div class="section-divider"></div>

          <!-- Middle: Answer Slots -->
          <div>
            <div class="text-[11px] uppercase tracking-[0.2em] text-[var(--theme-accent-alt)] font-bold mb-2">
              RUANG SUSUNAN JAWAPAN
            </div>
            <div class="grid ${gridClass} gap-2.5">
              ${round.slots.map((placedItem, idx) => {
                if (placedItem) {
                  const cat = CATEGORY_META[placedItem.category];
                  return `
                    <div data-slot-index="${idx}" class="answer-slot filled ${cat.cssClass}" style="border-left: 3px solid ${cat.color};">
                      <div class="flex items-center justify-between gap-1 mb-1">
                        <span class="text-[11px] font-extrabold text-[#20E88A]">#${idx + 1} ✓</span>
                        <span class="category-pill ${cat.cssClass}">${cat.iconSvg}<span>${cat.label}</span></span>
                      </div>
                      <div class="text-xs sm:text-sm font-bold leading-snug">${escapeHtml(placedItem.name)}</div>
                    </div>
                  `;
                }
                return `
                  <div data-slot-index="${idx}" class="answer-slot" role="button" tabindex="0">
                    <div class="flex items-center justify-between">
                      <span class="text-xs font-bold opacity-80">URUTAN #${idx + 1}</span>
                      <span class="text-[10px] uppercase opacity-50">Slot</span>
                    </div>
                    <div class="text-xs opacity-55 pt-1">
                      ${round.selectedCardId ? 'Tap untuk letak' : 'Letakkan kad rukun'}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <div class="section-divider"></div>

          <!-- Bottom: Bank Kad Rukun -->
          <div>
            <div class="text-[11px] uppercase tracking-[0.2em] text-[var(--theme-primary)] font-bold mb-2">
              BANK KAD RUKUN
            </div>
            <div class="grid ${gridClass} gap-2.5">
              ${round.bank.map(item => {
                const cat = CATEGORY_META[item.category];
                const isSelected = round.selectedCardId === item.id;
                const isHinted = round.activeHint && round.activeHint.targetItemId === item.id;
                return `
                  <div
                    draggable="true"
                    data-card-id="${item.id}"
                    class="rukun-card ${cat.cssClass} ${isSelected ? 'selected-tap' : ''} ${isHinted ? 'hint-highlight' : ''}"
                  >
                    <div class="flex items-center justify-between gap-1.5 mb-1.5">
                      <span class="category-pill ${cat.cssClass}">
                        ${cat.iconSvg}
                        <span>${cat.label}</span>
                      </span>
                      <span class="w-2 h-2 rounded-full" style="background:${cat.color};box-shadow:0 0 8px ${cat.color};"></span>
                    </div>
                    <div class="text-xs sm:text-sm font-bold leading-snug">
                      ${escapeHtml(item.name)}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </section>
      `;

      bindGameInteractions();
    }

    function bindGameInteractions() {
      const lvl = LEVELS_DATA[gameSession.currentLevelIndex];
      const round = gameSession.activeLevelState;

      document.getElementById('btn-game-menu')?.addEventListener('click', () => navigateTo('main-menu'));
      document.getElementById('btn-close-hint')?.addEventListener('click', () => {
        round.activeHint = null;
        renderStartGame();
      });

      document.getElementById('btn-hint')?.addEventListener('click', () => {
        if (round.hintsUsed >= lvl.hintLimit) return;
        const nextOrder = round.slots.findIndex(s => s === null) + 1;
        const targetItem = lvl.items.find(it => it.order === nextOrder && round.bank.some(b => b.id === it.id));
        if (!targetItem) return;

        const catInfo = CATEGORY_META[targetItem.category];
        round.hintsUsed += 1;
        round.activeHint = {
          category: targetItem.category,
          text: `${catInfo.hintText} (${catInfo.fullName})`,
          targetItemId: targetItem.id
        };
        renderStartGame();
      });

      document.querySelectorAll('.rukun-card').forEach(cardEl => {
        const cardId = cardEl.dataset.cardId;
        cardEl.addEventListener('click', (e) => {
          e.stopPropagation();
          round.selectedCardId = round.selectedCardId === cardId ? null : cardId;
          renderStartGame();
        });
        cardEl.addEventListener('dragstart', (e) => {
          round.selectedCardId = cardId;
          e.dataTransfer?.setData('text/plain', cardId);
        });
      });

      document.querySelectorAll('.answer-slot').forEach(slotEl => {
        const slotIdx = Number(slotEl.dataset.slotIndex);
        slotEl.addEventListener('click', () => {
          if (round.slots[slotIdx] || !round.selectedCardId) return;
          evaluatePlacement(round.selectedCardId, slotIdx);
        });
        slotEl.addEventListener('dragover', (e) => {
          if (round.slots[slotIdx]) return;
          e.preventDefault();
          slotEl.classList.add('drag-over');
        });
        slotEl.addEventListener('dragleave', () => {
          slotEl.classList.remove('drag-over');
        });
        slotEl.addEventListener('drop', (e) => {
          e.preventDefault();
          slotEl.classList.remove('drag-over');
          if (round.slots[slotIdx]) return;
          const cardId = e.dataTransfer?.getData('text/plain') || round.selectedCardId;
          if (cardId) evaluatePlacement(cardId, slotIdx);
        });
      });
    }

    function evaluatePlacement(cardId, slotIdx) {
      const round = gameSession.activeLevelState;
      const cardItem = round.bank.find(item => item.id === cardId);
      if (!cardItem) return;

      gameSession.attemptCount += 1;
      const expectedOrder = slotIdx + 1;

      if (cardItem.order === expectedOrder) {
        round.slots[slotIdx] = cardItem;
        round.bank = round.bank.filter(item => item.id !== cardId);
        round.selectedCardId = null;
        round.activeHint = null;

        gameSession.correctCount += 1;
        gameSession.streak += 1;
        gameSession.highestStreak = Math.max(gameSession.highestStreak, gameSession.streak);
        gameSession.score += 100;
        gameSession.sessionXp += 100;
        appState.xp += 100;
        appState.totalScore = Math.max(appState.totalScore, gameSession.score);
        appState.highestStreak = Math.max(appState.highestStreak, gameSession.highestStreak);

        recordLeaderboardEntry(appState.playerName || 'Pejuang Solat', gameSession.score, appState.xp);
        saveState();
        renderStartGame();

        if (gameSession.streak >= 2) {
          triggerFullscreenEffect('streak', gameSession.streak);
        } else {
          triggerFullscreenEffect('correct');
        }

        if (round.slots.every(Boolean)) {
          setTimeout(() => completeCurrentLevel(), 1150);
        }
      } else {
        gameSession.streak = 0;
        gameSession.hadMistakeInRun = true;
        round.selectedCardId = null;
        saveState();
        renderStartGame();
        triggerFullscreenEffect('wrong');
      }
    }

    function completeCurrentLevel() {
      const lvl = LEVELS_DATA[gameSession.currentLevelIndex];
      const acc = gameSession.attemptCount > 0
        ? Math.round((gameSession.correctCount / gameSession.attemptCount) * 100)
        : 100;

      let bonusXp = 200;
      let bonusNote = '+200 XP Bonus Level';
      const isLastLevel = gameSession.currentLevelIndex === LEVELS_DATA.length - 1;

      if (isLastLevel) {
        bonusXp += 500;
        bonusNote += ' +500 XP Semua Level';
        appState.completedAll = true;
        if (!gameSession.hadMistakeInRun) {
          bonusXp += 300;
          bonusNote += ' +300 XP Perfect Score!';
        }
      }

      gameSession.sessionXp += bonusXp;
      appState.xp += bonusXp;
      appState.levelReached = Math.max(appState.levelReached, Math.min(3, lvl.level + 1));

      gameSession.levelStats.push({
        level: lvl.level,
        title: lvl.title,
        accuracy: acc,
        bonusXp,
        bonusNote
      });

      recordLeaderboardEntry(
        appState.playerName || 'Pejuang Solat',
        gameSession.score,
        appState.xp,
        appState.completedAll ? 'Completed' : `Level ${appState.levelReached}`
      );
      saveState();

       11. THEME CUSTOMIZATION (FUTURISTIC, RETRO BLUE ARCADE, GUNDAM)
       --------------------------------------------------------------------- */
    function renderThemePage() {
      const themes = [
        {
          id: 'futuristic',
          name: 'FUTURISTIC',
          tag: 'DARK PURPLE',
          desc: 'Dark purple glass (rgba(20, 10, 42, 0.94) & rgba(42, 22, 75, 0.92)), lavender border & soft lavender glow.',
          bar: 'linear-gradient(90deg, rgba(20, 10, 42, 0.95), rgba(42, 22, 75, 0.95), #C084FC)'
        },
        {
          id: 'retro',
          name: 'RETRO – DARK NAVY ARCADE',
          tag: 'DARK NAVY',
          desc: 'Dark navy blue glass (rgba(7, 20, 46, 0.94) & rgba(15, 41, 82, 0.92)), cyan & bright blue text.',
          bar: 'linear-gradient(90deg, rgba(7, 20, 46, 0.95), rgba(15, 41, 82, 0.95), #38BDF8)'
        },
        {
          id: 'gundam',
          name: 'GUNDAM – DARK GUNMETAL HUD',
          tag: 'DARK METALLIC',
          desc: 'Dark gunmetal glass (rgba(24, 28, 36, 0.94) & rgba(43, 49, 62, 0.92)), white, red & blue accents.',
          bar: 'linear-gradient(90deg, rgba(24, 28, 36, 0.95), #2563EB, #EF4444)'
        }
      ];

      container.innerHTML = `
        <section class="w-full max-w-4xl mx-auto flex flex-col gap-4">
          <div class="flex items-center justify-between">
            <div>
              <span class="text-[11px] uppercase tracking-[0.28em] text-[var(--theme-primary)] font-bold">VISUAL IDENTITY</span>
              <h2 class="font-display text-2xl sm:text-3xl font-extrabold text-[var(--text-white)]">THEME</h2>
            </div>
            <button id="btn-theme-back" type="button" class="futuristic-btn">← Kembali</button>
          </div>

          <div class="section-divider"></div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            ${themes.map(t => {
              const active = appState.theme === t.id;
              return `
                <button data-theme-choice="${t.id}" type="button" class="p-5 rounded-2xl text-left transition-all cursor-pointer bg-white/[0.08] ${active ? 'border-2 border-[var(--theme-primary)] shadow-[0_0_24px_var(--theme-glow)]' : 'border border-current/20 hover:border-[var(--theme-primary)]'}">
                  <div class="w-full h-3 rounded-full mb-4 border border-black/10" style="background:${t.bar};"></div>
                  <div class="flex items-center justify-between gap-2 mb-1.5">
                    <span class="font-display font-extrabold text-sm sm:text-base text-[var(--text-white)]">${t.name}</span>
                    <span class="text-[10px] px-2 py-0.5 rounded-full bg-white/10 text-[var(--theme-accent-alt)] font-bold">${active ? 'AKTIF' : t.tag}</span>
                  </div>
                  <p class="text-xs text-[var(--text-soft)] leading-relaxed">${t.desc}</p>
                </button>
              `;
            }).join('')}
          </div>
        </section>
      `;

      document.getElementById('btn-theme-back')?.addEventListener('click', () => navigateTo('main-menu'));
      document.querySelectorAll('[data-theme-choice]').forEach(btn => {
        btn.addEventListener('click', () => {
          appState.theme = btn.dataset.themeChoice;
          applyThemeAndSettings();
          audio.playTone('transition');
          renderThemePage();
        });
      });
    }

    /* ---------------------------------------------------------------------
       10. QUIT MODAL HANDLERS
       --------------------------------------------------------------------- */
    function openQuitModal() {
      const modal = document.getElementById('quit-modal');
      if (!modal) return;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeQuitModal() {
      const modal = document.getElementById('quit-modal');
      if (!modal) return;
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    document.getElementById('btn-back-to-game')?.addEventListener('click', closeQuitModal);
    document.getElementById('btn-confirm-exit')?.addEventListener('click', () => {
      closeQuitModal();
      audio.stopAmbientMusic(true);
      recordLeaderboardEntry(appState.playerName || 'Pejuang Solat', appState.totalScore, appState.xp);
      saveState();
      navigateTo('name-entry');
    });

    /* =====================================================================
       7. UTILITY & INITIALIZATION
       ===================================================================== */
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    window.addEventListener('DOMContentLoaded', () => {
      bgmManager.initOnce();
      applyThemeAndSettings();
      navigateTo('loading');
    });
  </script>
</body>
</html>
